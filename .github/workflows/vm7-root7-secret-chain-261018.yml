name: VM7 Fork Main External Read Protected Secret 261018

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prevention-gate:
    name: vm7-prevention-read-secret-gate-261018
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ vars.MERGIFY_TOKEN_ROOT7_SECRET }}
      MERGIFY_TEST_JOB_NAME: vm7-fork-main-external-read-secret-261018
    steps:
      - name: Install exact supported Test Engine client
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 pytest-mergify==2026.10.5
      - name: Run fixed target-owned Prevention test
        shell: bash
        env:
          VM7_MODE: ${{ github.event_name == 'workflow_dispatch' && 'seed' || github.event.pull_request.head.ref == 'main' && 'poison' || 'consumer' }}
        run: |
          cat > test_vm7_fork_main_external_read_secret_261018.py <<'PY'
          import os
          from pathlib import Path

          def test_vm7_fork_main_external_read_secret_seed_261018():
              assert True

          if os.environ["VM7_MODE"] != "seed":
            def test_vm7_fork_main_external_read_secret_candidate_261018():
              if os.environ["VM7_MODE"] == "poison":
                  assert True
                  return

              marker = Path("/tmp/vm7-fork-main-external-read-secret-attempt-261018")
              if not marker.exists():
                  marker.write_text("first invocation passed\n")
                  assert True
                  return

              raise AssertionError("VM7_FORK_MAIN_EXTERNAL_READ_SECRET_RERUN_FAILURE_261018")
          PY
          pytest -q -s test_vm7_fork_main_external_read_secret_261018.py

  protected-environment-consumer:
    name: vm7-root7-protected-environment-consumer-261018
    if: github.event_name == 'push' && github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-root7-secret-env-261018
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        shell: bash
        env:
          VM7_ROOT7_PROTECTED_SECRET: ${{ secrets.VM7_ROOT7_PROTECTED_SECRET }}
        run: bash ./deploy-vm7-root7-secret-261018.sh
      - name: Publish controlled deployment result
        uses: actions/upload-artifact@v4
        with:
          name: vm7-root7-secret-${{ github.sha }}
          path: vm7-root7-secret-artifact-261018/
          if-no-files-found: error
          retention-days: 1
